# egui-winit 0.37.0 as pinned by FilmCraft (storytold/egui at 6d518fc799681571963842f95b55a6b68431b15a),
# with the FilmCraft keypad patch (FILMCRAFT-PATCH.md). The manifest is Cargo.toml.orig with the
# egui workspace's inherited values written out; the lints table, the example and its
# dev-dependency are left out.
[package]
name = "egui-winit"
version = "0.37.0"
authors = ["Emil Ernerfeldt <emil.ernerfeldt@gmail.com>"]
description = "Bindings for using egui with winit"
edition = "2024"
rust-version = "1.95"
homepage = "https://github.com/emilk/egui/tree/main/crates/egui-winit"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/emilk/egui/tree/main/crates/egui-winit"
categories = ["gui", "game-development"]
keywords = ["winit", "egui", "gui", "gamedev"]
autoexamples = false

[features]
default = ["clipboard", "clipboard-image", "links", "wayland", "winit/default", "x11"]
accesskit = ["dep:accesskit_winit"]
android-game-activity = ["winit/android-game-activity"]
android-native-activity = ["winit/android-native-activity"]
bytemuck = ["egui/bytemuck", "dep:bytemuck"]
clipboard = ["arboard", "bytemuck", "smithay-clipboard"]
clipboard-image = ["clipboard", "dep:image", "dep:parking_lot"]
links = ["webbrowser"]
serde = ["egui/serde", "dep:serde"]
wayland = ["winit/wayland", "bytemuck", "arboard?/wayland-data-control"]
x11 = ["winit/x11", "winit/rwh_06", "bytemuck"]

[dependencies]
egui = { version = "0.37.0", default-features = false }
log = { version = "0.4.34", features = ["std"] }
profiling = { version = "1.0", default-features = false }
raw-window-handle = "0.6.2"
web-time = "1.1"
winit = { version = "0.30.13", default-features = false }
accesskit_winit = { version = "0.34.0", optional = true }
bytemuck = { version = "1.25", optional = true }
document-features = { version = "0.2.12", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
webbrowser = { version = "1.2.4", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSEvent", "NSResponder"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSThread"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "UIApplication",
  "UIGeometry",
  "UIResponder",
  "UIScene",
  "UISceneDefinitions",
  "UIView",
  "UIWindow",
  "UIWindowScene",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(any(target_os="linux", target_os="dragonfly", target_os="freebsd", target_os="netbsd", target_os="openbsd"))'.dependencies]
smithay-clipboard = { version = "0.7.2", optional = true }
parking_lot = { version = "0.12.5", optional = true }
wayland-cursor = { version = "0.31.14", default-features = false, optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["image-data"], optional = true }
