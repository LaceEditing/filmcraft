[package]
name = "filmcraft-gpu"
description = "wgpu compositor: YUV/RGB layer sampling, linear-light premultiplied compositing in WGSL"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
filmcraft-color = { workspace = true }
filmcraft-frame = { workspace = true }
filmcraft-geom = { workspace = true }
filmcraft-render = { workspace = true }
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
log = { workspace = true }
rayon = { workspace = true }
pollster = { version = "0.4", optional = true }

[features]
# A compositor on its own device for exports (`headless`, `register_plan_renderer`): blocks on
# device creation and read-back, so native only; enables wgpu's native backends.
headless = ["dep:pollster", "wgpu/vulkan", "wgpu/metal", "wgpu/dx12"]

[dev-dependencies]
pollster = "0.4"
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
filmcraft-media = { workspace = true }
filmcraft-project = { workspace = true }
filmcraft-time = { workspace = true }
